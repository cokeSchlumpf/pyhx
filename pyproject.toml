[project]
name = "pyhx"
version = "0.1.0"
description = "Web apps with Python and HTMX"
authors = [
    {name = "Michael Wellner", email = "michael.wellner@gmail.com"}
]
requires-python = ">=3.12, <4.0"

[tool.poetry]
packages = [{ include = "pyhx", from = "src" }]

[tool.poetry.dependencies]
babel = "^2.18"
fastapi = {extras = ["standard"], version = "^0.141.1"}
htpy = "^26.5.1"
humanize = "^4.15.0"
itsdangerous = "^2.2.0"
markdown-it-py = "^4.2.0"
nh3 = "^0.3.5"
pygments = "^2.19"
python-multipart = "^0.0.32"

commons = { git = "https://KPMGCH@dev.azure.com/KPMGCH/Financial%20Service%20-%20Consulting/_git/lib--commons", branch = "main" }
typing-extensions = "^4.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
poethepoet = "^0.48.0"
ruff = "^0.16.3"
pytest = "^9.1.1"
pytest-dotenv = "^0.5.2"
pytest-cov = "^7.0.0"
ipykernel = "^7.2.0"
types-pygments = "^2.20.0.20260518"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.6"

[tool.ruff.lint]
ignore = [
    # PEP 695 native generics (`class Foo[T]` / `def f[T]()`). The generics here
    # use shared, bounded, module-level TypeVars (and a ParamSpec with overloads),
    # so migrating is a coordinated multi-file refactor with no runtime benefit.
    # Deferred to its own dedicated change.
    "UP046",
    "UP047",
]

[tool.ruff.lint.flake8-bugbear]
# Immutable, frozen value objects that are safe to call in argument / dataclass
# defaults. Silences B008 and RUF009 for these without contorting the call sites.
extend-immutable-calls = [
    "pyhx.components.view_model.columns.Flex",
    "pyhx.components.view_model.Flex",
    "pyhx.components.view_model.Color.neutral",
    "pyhx.components.view_model.CalendarLabels",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so the non-installed `samples` app is
# importable in tests (`pyhx` itself is an installed package and needs no help).
pythonpath = ["."]

[tool.poe.tasks]
docs = { cmd = "mkdocs serve -a localhost:8090", help = "Serve documentation locally" }
docs-build = { cmd = "mkdocs build", help = "Build documentation site" }

check = [
    { cmd = "ruff check src/pyhx"},
    { cmd = "ruff format --check src/pyhx"},
    { cmd = "mypy src/pyhx"}
]

fix = [
    { cmd = "ruff check src/pyhx --fix" },
    { cmd = "ruff format src/pyhx" }
]

test = [
    { cmd = "pytest" }
]